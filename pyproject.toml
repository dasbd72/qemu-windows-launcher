[project]
name = "qemu-wtg"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

# This project is not distributed via pip -- it ships as an AUR package
# (qemu-wtg-git) that copies bin/qemu-wtg and src/qemu_wtg straight into
# place. pyproject.toml exists only so uv can manage the dev-tooling venv
# (pre-commit, ruff, mypy) with a single lockfile.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src/qemu_wtg"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]
