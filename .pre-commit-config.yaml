# Tool versions for ruff/mypy/the test runner all come from uv.lock via
# `uv run` -- see README.md for the one-time `uv sync && pre-commit install`
# setup step. Only the generic hygiene hooks below use pre-commit's own
# mirrored repos, since their versions aren't project-specific.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy --strict
        entry: uv run mypy --strict src/qemu_wtg
        language: system
        types: [python]
        pass_filenames: false

      - id: unittest
        name: unittest
        entry: env PYTHONPATH=src uv run python -m unittest discover -s tests
        language: system
        types: [python]
        pass_filenames: false
